services:
  # PostgreSQL データベース
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    networks:
      - default
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=au_mod_installer
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d au_mod_installer"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # SeaweedFS (Apache 2.0 ライセンスの軽量・高速 S3 互換オブジェクトストレージ)
  # MinIO の EOS / ライセンス制限に対する最適なオープンソース代替
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    ports:
      - "8333:8333" # S3 API (http://localhost:8333)
      - "8888:8888" # Filer UI / Web ブラウザ閲覧 (http://localhost:8888)
      - "9333:9333" # Master Status UI (http://localhost:9333)
    networks:
      - default
    volumes:
      - seaweedfs-data:/data
    command: "server -dir=/data -s3 -s3.port=8333 -s3.allowEmptyFolder=true -ip.bind=0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # API Server (Mod of Us Go Backend + Discord Bot)
  au-mod-installer-server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    restart: unless-stopped
    networks:
      - default
    ports:
      - "8180:8180"
    environment:
      - TZ=Asia/Tokyo
      - ADDR=:8180
      - DATABASE_URL=postgres://postgres:password@postgres:5432/au_mod_installer?sslmode=disable
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_PUBLIC_ENDPOINT=http://localhost:8333
      - S3_REGION=us-east-1
      - S3_BUCKET=au-mods
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_USE_PATH_STYLE=true
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
      - DISCORD_REVIEW_CHANNEL_ID=${DISCORD_REVIEW_CHANNEL_ID:-}
      - DISCORD_SHOWCASE_FORUM_ID=${DISCORD_SHOWCASE_FORUM_ID:-}
      - DISCORD_UPDATES_CHANNEL_ID=${DISCORD_UPDATES_CHANNEL_ID:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8180/api/v1/health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 32M

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: au-mod-installer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      au-mod-installer-server:
        condition: service_healthy
    profiles:
      - with-nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  seaweedfs-data:

networks:
  default:
    driver: bridge
